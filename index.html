<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koino</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(100% 60% at 80% 0%,rgba(255,158,122,.5),rgba(255,158,122,0) 60%),linear-gradient(170deg,#2A2378,#0F1446);
    color:#fff;font-family:Figtree,system-ui,-apple-system,sans-serif;text-align:center}
  main{max-width:420px;display:flex;flex-direction:column;gap:16px}
  span{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#FFB79B}
  h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.02em}
  p{margin:0;color:rgba(255,255,255,.78);font-size:17px;line-height:1.5}
</style>
</head>
<body>
<main>
  <span>Koino</span>
  <h1>Conversations that bring people closer.</h1>
  <p>Koino is available to members inside the Whop app. Open your Koino membership on Whop to continue.</p>
</main>
</body>
</html>
